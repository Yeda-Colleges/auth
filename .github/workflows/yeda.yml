name: Verify and publish Yeda auth

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: yeda-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Verify Login V2
        run: pnpm nx run-many --nxBail --projects @zitadel/login @zitadel/client --targets lint test-unit build
      - name: Verify and package backend
        run: |
          pnpm nx run @zitadel/api:test-unit
          pnpm nx run @zitadel/api:pack-linux-amd64

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Build publish inputs
        run: |
          pnpm nx run @zitadel/login:build
          pnpm nx run @zitadel/api:pack-linux-amd64
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: final
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yeda-colleges/auth:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Yeda-Colleges/auth
            org.opencontainers.image.version=v4.17.3
      - name: Publish immutable Login V2 image
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yeda-colleges/auth-login:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Yeda-Colleges/auth
            org.opencontainers.image.version=v4.17.3
            org.opencontainers.image.licenses=MIT
