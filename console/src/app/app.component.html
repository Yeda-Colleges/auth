<div class="main-container yeda-account" [dir]="language === 'he' || language === 'ar' ? 'rtl' : 'ltr'">
  <header class="yeda-account-header">
    <a class="yeda-brand" routerLink="/users/me" aria-label="Yeda">Yeda</a>
    <div class="yeda-account-controls">
      <label>
        <span class="yeda-sr-only">{{ 'YEDA.LANGUAGE' | translate }}</span>
        <select [value]="language" (change)="selectLanguage($event)">
          <option value="en" lang="en">English</option>
          <option value="he" lang="he">עברית</option>
          <option value="uk" lang="uk">Українська</option>
        </select>
      </label>
      @if (authService.user | async) {
        <button type="button" (click)="authenticationService.signout()">{{ 'YEDA.SIGNOUT' | translate }}</button>
      }
    </div>
  </header>
  <main class="router-container" id="account-content">
    <router-outlet #outlet="outlet"></router-outlet>
  </main>
  <cnsl-footer></cnsl-footer>
</div>
